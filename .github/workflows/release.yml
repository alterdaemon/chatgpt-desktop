name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder desktop-file-utils appstream xvfb

      - name: Add Flathub remote
        run: sudo flatpak remote-add --system --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Install Flatpak runtimes
        run: |
          sudo flatpak install --system --noninteractive flathub \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08 \
            org.electronjs.Electron2.BaseApp//24.08

      - name: Install dependencies
        run: npm ci

      - name: Configure Electron sandbox
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: Run tests
        run: npm test
        env:
          CHATGPT_TEST_EMAIL: ${{ secrets.CHATGPT_TEST_EMAIL }}
          CHATGPT_TEST_PASSWORD: ${{ secrets.CHATGPT_TEST_PASSWORD }}
          CHATGPT_TEST_SESSION_COOKIES: ${{ secrets.CHATGPT_TEST_SESSION_COOKIES }}

      - name: Build Linux packages
        run: npm run build:linux

      - name: Validate Flatpak assets
        run: npm run validate:flatpak-assets

      - name: Build Flatpak bundle
        run: npm run build:flatpak

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*.flatpak
