name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ fromJSON(github.event_name == 'push' && github.repository == 'alterdaemon/chatgpt-desktop' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && vars.CHATGPT_TRUSTED_RUNNER || '["ubuntu-latest"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install display server
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download Electron binary
        run: npx install-electron --no

      - name: Configure Electron sandbox
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: Run tests
        run: npm test
        env:
          CHATGPT_TEST_EMAIL: ${{ secrets.CHATGPT_TEST_EMAIL }}
          CHATGPT_TEST_PASSWORD: ${{ secrets.CHATGPT_TEST_PASSWORD }}
          CHATGPT_TEST_SESSION_COOKIES: ${{ secrets.CHATGPT_TEST_SESSION_COOKIES }}
