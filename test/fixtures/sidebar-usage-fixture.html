<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><title>Sidebar usage fixture</title>
<style>
body { margin: 0; display: flex; }
aside { width: 280px; padding: 4px; box-sizing: border-box; }
aside.compact { width: 44px; }
button { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 32px; padding: 2px; }
svg { flex-shrink: 0; }
main { padding: 12px; }
[role="tooltip"] { background: #222; color: #fff; padding: 4px; }
</style></head><body>
<aside id="app-shell-sidebar">
  <button id="usage" aria-label="Usage" interestfor="usage-tooltip" style="height:32px">
    <svg width="16" height="16" aria-hidden="true"><path d="M8 0 16 8 8 16 0 8Z"></path></svg>
  </button>
  <button id="react-usage" aria-label="Usage" aria-describedby="lazy-usage-tooltip"><svg width="16" height="16"></svg></button>
  <button id="unrelated" aria-label="Search" aria-describedby="search-tooltip">S</button>
  <div data-sidebar-archive-chatgpt-id="fixture"><button id="conversation" aria-describedby="conversation-tooltip">Chat</button></div>
</aside>
<main><button id="outside">Outside</button></main>
<div id="usage-tooltip" role="tooltip" hidden>Weekly · 3% left</div>
<div id="search-tooltip" role="tooltip" hidden>Search chats</div>
<div id="conversation-tooltip" role="tooltip" hidden>Weekly budget · 50% left</div>
<script>
  const usage = document.querySelector("#usage");
  window.originalUsageTrigger = usage;
  usage.addEventListener("mouseenter", () => { document.querySelector("#usage-tooltip").hidden = false; });
  usage.addEventListener("mouseleave", () => { document.querySelector("#usage-tooltip").hidden = true; });
  usage.addEventListener("click", () => { window.usageClicked = true; });
  // Models a native lazy tooltip's already-existing React element props. No
  // account state, API response or real content is included in this fixture.
  document.querySelector("#react-usage").__reactFiber$fixture = {
    memoizedProps: { content: { props: { values: { remainingPercent: 75 } } } }, return: null,
  };
</script></body></html>
